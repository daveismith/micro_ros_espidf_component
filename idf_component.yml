version: "24.0.0"
description: "Micro-ROS ESP-IDF component and sample code"
url: "https://github.com/micro-ROS/micro_ros_espidf_component"
repository: "https://github.com/micro-ROS/micro_ros_espidf_component.git"
license: "Apache-2.0"
tags:
  - micro-ros
  - ros2
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32p4
dependencies:
  idf: ">=5.2"
  # Upstream pulls esp_wifi_remote and esp_hosted in on the ESP32-P4 here. This fork does
  # not: the application owns its network (MICRO_ROS_ESP_NETIF_NONE), and whether the P4
  # has a radio at all is the application's decision and its manifest's.
files:
  use_gitignore: true
  exclude:
    - ".github/**"
